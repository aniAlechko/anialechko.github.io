<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Alex Rivkin — Product Designer. A new portfolio is under construction." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <title>Alex Rivkin</title>
  <link rel="preload" href="/fonts/PPNeueMontrealTT-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/PPNeueMontreal-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/images/alex-rivkin-idle.png" as="image" />
  <link rel="preload" href="/images/alex-rivkin-jump.png" as="image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23efee74' d='M13 3h6v7h3v8h3v7h4v4H3v-4h4v-7h3v-8h3z'/%3E%3Cpath fill='%23fff' d='M10 12h12v5H10zM7 21h18v4H7z'/%3E%3C/svg%3E" />
  <style>html { background: #000; }</style>
  <link rel="stylesheet" href="/construction.css" />
  <script>
    document.documentElement.classList.add('js');
    window.setTimeout(() => {
      if (!document.documentElement.classList.contains('is-ready')) {
        document.documentElement.classList.add('is-ready', 'skip-intro');
      }
    }, 4000);
  </script>
</head>
<body>
  <canvas id="hero-field" aria-hidden="true"></canvas>
  <header class="contact-header" aria-label="Contact">
    <a class="email" href="mailto:anialechko@gmail.com" aria-label="Email Alex Rivkin at anialechko@gmail.com"><span class="desktop-label">anialechko@gmail.com</span><span class="mobile-label" aria-hidden="true">Email</span></a>
    <a class="linkedin" href="https://www.linkedin.com/in/anialechko/" target="_blank" rel="noopener noreferrer" aria-label="Alex Rivkin on LinkedIn (opens in a new tab)"><span class="desktop-label">linkedin.com/in/anialechko</span><span class="mobile-label" aria-hidden="true">LinkedIn</span></a>
  </header>
  <main class="hero" aria-labelledby="page-title" aria-describedby="construction-note">
    <div class="hero-composition">
    <h1 id="page-title" class="hero-name">
      <span class="name-position given-name"><span class="name-word">Alex</span></span>
      <span class="name-position family-name"><span class="name-word">Rivkin</span></span>
    </h1>
    <div class="construction-position" aria-hidden="true">
      <div class="construction-character">
        <div class="character-pose character-pose--idle">
          <img class="character-image" src="/images/alex-rivkin-idle.png" width="1024" height="1536" alt="" fetchpriority="high" draggable="false" />
        </div>
        <div class="character-pose character-pose--jump">
          <img class="character-image" src="/images/alex-rivkin-jump.png" width="1024" height="1536" alt="" fetchpriority="high" draggable="false" />
        </div>
      </div>
      <div class="speech">
        <svg class="speech-frame" viewBox="0 0 320 100" preserveAspectRatio="none">
          <path fill="#fff" d="M16 0h288v8h8v8h8v60h-8v8H76v8h-8v8H52V84H16v-8H8v-8H0V16h8V8h8z" />
          <path fill="#000" d="M16 8h288v8h8v52h-8v8H68v8h-8V76H16V68H8V16h8z" />
        </svg>
        <div class="speech-copy">
          <span class="speech-word-mask"><span class="speech-word">OPEN</span></span>
          <span class="speech-word-mask"><span class="speech-word">TO</span></span>
          <span class="speech-word-mask"><span class="speech-word">WORK</span></span>
        </div>
      </div>
    </div>
    </div>
    <p class="visually-hidden" id="construction-note">Portfolio under construction. I'm putting together a new portfolio. You can contact me by email or LinkedIn.</p>
    <footer class="hero-details">
      <p class="role">PRODUCT DESIGNER<br />BASED IN TEL AVIV</p>
      <p class="status">UX/UI, MOBILE &amp; WEB<br />INTERACTION DESIGN</p>
    </footer>
  </main>
  <script type="module" src="/construction-entry.js"></script>
</body>
</html>
