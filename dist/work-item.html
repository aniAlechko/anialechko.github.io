<section class="feed-detail shell" id="work-item" aria-labelledby="work-item-title">
  <figure class="placeholder project-visual" aria-label="{{title}} image placeholder">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use href="#placeholder-cross" /></svg>
    <span>Project image {{number}}</span>
  </figure>
  <div class="project-caption feed-detail-copy">
    <h1 id="work-item-title">{{title}}</h1>
    <p>Case study coming soon.</p>
    <a class="feed-return" href="/work" data-cursor-arrow="←">← Back to work</a>
  </div>
</section>
