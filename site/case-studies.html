<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Alex Rivkin's case studies are under construction." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <title>Case Studies — Alex Rivkin</title>
  <link rel="preload" href="/fonts/PPNeueMontrealTT-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'Neue Montreal Display';
      src: url('/fonts/PPNeueMontrealTT-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html { background: #000; color: #fff; color-scheme: dark; }
    body { margin: 0; }
    main {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
    }
    h1 {
      margin: 0;
      font-family: 'Neue Montreal Display', Arial, sans-serif;
      font-size: clamp(1.5rem, 6vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -.04em;
      text-align: center;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <main>
    <h1>UNDER CONSTRUCTION</h1>
  </main>
</body>
</html>
