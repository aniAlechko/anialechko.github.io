<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Explore Alex Rivkin's case studies. New projects are coming soon." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <title>Case Studies - Alex Rivkin</title>
  <link rel="canonical" href="https://anialechko.github.io/case-studies/" />
  <link rel="preload" href="/fonts/PPNeueMontreal-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/case-studies.css" />
  <link rel="stylesheet" href="/header.css" />
</head>
<body>
  <header class="site-header" aria-label="Navigation">
    <a class="home-link" href="/" aria-label="Back to Alex Rivkin's portfolio">BACK</a>
  </header>
  <main id="gallery" aria-label="Case studies">
    <canvas id="project-wall" tabindex="0" aria-label="Interactive case studies wall" aria-describedby="navigation-hint"></canvas>
    <div class="loading" role="status"><span class="loading-ring" aria-hidden="true"></span><span class="sr-only">Loading case studies</span></div>
    <div id="project-fallback" hidden aria-label="All case studies"></div>
    <p id="navigation-hint" class="sr-only">Scroll or drag in any direction. Use arrow keys to move, plus and minus to zoom, Home to reset, and Enter to open the centered project. Pinch to zoom on touch screens.</p>
    <div class="sr-only" role="status" aria-live="polite" aria-atomic="true" id="project-readout"></div>
  </main>
  <dialog id="project-dialog" aria-labelledby="detail-title" aria-describedby="detail-description">
    <div class="detail-panel">
      <section class="detail-main" aria-label="Selected project">
        <div class="detail-toolbar">
          <button id="close-project" class="close-button" type="button" aria-label="Close project"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 8 8M14 6 6 14"/></svg><span>Close</span></button>
        </div>
        <div class="detail-screen">
          <div class="detail-screen-surface" hidden>
            <canvas id="detail-static" aria-hidden="true"></canvas>
            <img id="detail-image" alt="" hidden />
            <video id="detail-video" muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1" hidden></video>
            <div class="cover-caption"><strong id="cover-title"></strong><span id="cover-subtitle"></span></div>
          </div>
        </div>
        <div class="detail-caption">
          <span id="detail-mark" class="detail-mark" aria-hidden="true"></span>
          <div class="detail-identity"><h1 id="detail-title" tabindex="-1"></h1><p id="detail-description"></p></div>
          <button id="detail-more" class="detail-action" type="button" disabled>Know more <span aria-hidden="true">&#8599;</span></button>
        </div>
      </section>
      <aside class="detail-related" aria-labelledby="related-title">
        <h2 id="related-title">YOU MAY ALSO LIKE</h2>
        <div id="related-projects" class="related-projects"></div>
      </aside>
    </div>
  </dialog>
  <noscript><div class="noscript-note"><h1>Case studies are coming soon.</h1><a href="/">Back to the portfolio</a></div></noscript>
  <script type="module" src="/case-studies.js"></script>
</body>
</html>
